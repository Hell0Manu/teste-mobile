// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.2.0' apply false // Check for latest stable
    id 'org.jetbrains.kotlin.android' version '1.9.0' apply false // Check for latest stable Kotlin
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
